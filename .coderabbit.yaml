# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: ko-KR
tone_instructions: "팀원에게 말하듯 짧고 쉬운 한국어로, 고쳐야 하는 이유를 한 줄로 설명해줘."
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  enable_prompt_for_ai_agents: false
  poem: false
  in_progress_fortune: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  suggested_reviewers: false
  auto_assign_reviewers: false
  review_status: true
  fail_commit_status: false
  auto_review:
    enabled: true
    drafts: false
    base_branches: [main]
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false
  path_filters:
    - "!**/dist/**"
    - "!**/node_modules/**"
    - "!package-lock.json"
  path_instructions:
    - path: "src/**"
      instructions: |
        - 버튼과 입력칸에 라벨이 있는지(접근성) 봐줘.
        - API 키나 비밀값이 코드에 하드코딩되어 있으면 지적해줘.
chat:
  auto_reply: true
